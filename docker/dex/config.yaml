# config.yaml
# =============================================================================
# Dex OIDC Configuration
# =============================================================================
# For production, the issuer is set via environment or static config.
# Default issuer: http://localhost:5556/dex (for development)
# Production issuer: https://${DOMAIN}/dex (configured via nginx proxy)
# =============================================================================
issuer: https://opengluon.cloud/dex
storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556
  allowedOrigins: ['*']
  allowedHeaders: ['x-requested-with']
staticClients:
  - id: daytona
    redirectURIs:
      # Development redirect URIs (localhost)
      - 'http://localhost:3000'
      - 'http://localhost:3000/api/oauth2-redirect.html'
      - 'http://localhost:3009/callback'
      - 'http://proxy.localhost:4000/callback'
      # Production redirect URIs
      - 'https://opengluon.cloud'
      - 'https://opengluon.cloud/api/oauth2-redirect.html'
      - 'https://opengluon.cloud:3009/callback'
      - 'https://proxy.opengluon.cloud:8443/callback'
    name: 'Daytona'
    public: true
enablePasswordDB: true
staticPasswords:
  - email: 'frankawp@daytona.io'
    # password generated with:
    # echo password | htpasswd -BinC 10 frankawp | cut -d: -f2
    hash: '$2y$10$Jllp7p7aO6O3FxIJCJxzwesf/Etc34K0KxFmxVozQ8AmwWWy9ZnXO'
    username: 'frankawp'
    userID: '1234'
